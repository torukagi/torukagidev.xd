<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora TNT Edition</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; cursor: crosshair; }
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 20% 30%, #00ffcc 0%, transparent 50%), radial-gradient(circle at 80% 70%, #3300ff 0%, transparent 50%), radial-gradient(circle at 50% 10%, #ff00ff 0%, transparent 50%); background-size: 200% 200%; filter: blur(80px); animation: auroraMove 4s linear infinite; }
        @keyframes auroraMove { 0% { background-position: 0% 0%; filter: blur(80px) hue-rotate(0deg); } 50% { background-position: 100% 100%; filter: blur(120px) hue-rotate(180deg); } 100% { background-position: 0% 0%; filter: blur(80px) hue-rotate(360deg); } }
        .tnt-img { width: 200px; cursor: pointer; z-index: 10; filter: drop-shadow(0 0 20px red); transition: 0.1s; }
        .tnt-img:active { transform: scale(0.9); }
        .particle { position: fixed; pointer-events: none; border-radius: 50%; z-index: 999; animation: explode 0.6s ease-out forwards; }
        @keyframes explode { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        .shake { animation: shake 0.2s linear; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(8px,8px); } 50% { transform: translate(-8px,-8px); } }
    </style>
</head>
<body id="main">
    <div class="aurora-bg"></div>
    <img src="tnt.png" class="tnt-img" onclick="detonate(event)">
    <audio id="exp-snd" src="explosion.mp3" preload="auto"></audio>
    <audio id="clk-snd" src="click.mp3" preload="auto"></audio>
    <script>
        function detonate(e) {
            document.getElementById('exp-snd').currentTime = 0;
            document.getElementById('exp-snd').play().catch(() => {});
            document.getElementById('main').classList.remove('shake');
            void document.getElementById('main').offsetWidth;
            document.getElementById('main').classList.add('shake');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = ['#ff0','#f80','#f00','#fff'][Math.floor(Math.random()*4)];
                p.style.width = p.style.height = Math.random()*10+5+'px';
                p.style.left = e.clientX+'px'; p.style.top = e.clientY+'px';
                p.style.setProperty('--tx', (Math.random()-0.5)*400+'px');
                p.style.setProperty('--ty', (Math.random()-0.5)*400+'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }
        document.addEventListener('mousedown', () => {
            const c = document.getElementById('clk-snd');
            c.currentTime = 0; c.play().catch(() => {});
        });
    </script>
</body>
</html>
