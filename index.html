<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>torukagi</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000511; font-family: 'Consolas', monospace; color: white; }
        .bg-container {
            position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
            background: #000511 url('sky.png') no-repeat center center;
            background-size: cover; z-index: -1; transition: transform 0.1s ease-out;
        }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 50; }
        canvas { position: fixed; top: 0; left: 0; z-index: 10; pointer-events: none; }
        .sns { position: fixed; top: 20px; left: 20px; z-index: 100; }
        .sns-link { display: flex; align-items: center; gap: 8px; color: white; border: 1px solid white; padding: 10px 20px; text-decoration: none; border-radius: 30px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .ui { position: fixed; bottom: 30px; left: 30px; z-index: 100; }
        #weather-btn { cursor: pointer; padding: 10px 20px; border: 1px solid white; background: rgba(0,0,0,0.6); border-radius: 5px; margin-bottom: 10px; display: inline-block; }
        #clock { font-size: 36px; font-weight: bold; text-shadow: 0 0 10px #00f2ff; }
    </style>
</head>
<body>
    <div class="bg-container" id="bg"></div>
    <div id="flash"></div>
    <canvas id="cvs"></canvas>

    <div class="sns">
        <a href="https://x.com/bakakagi" target="_blank" class="sns-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
            <span>X (Twitter)</span>
        </a>
    </div>

    <div class="ui">
        <div id="weather-btn">WEATHER: CLEAR (CLICK)</div>
        <div id="clock">--:--:--</div>
    </div>

    <script>
        const bg = document.getElementById('bg');
        const flash = document.getElementById('flash');
        const cvs = document.getElementById('cvs');
        const ctx = cvs.getContext('2d');
        const clockEl = document.getElementById('clock');
        let w, h, particles = [], wType = 'clear';

        // --- 音の設定 ---
        const sounds = {
            clear: new Audio('cricket.mp3'),
            rain: new Audio('rain.mp3'),
            snow: new Audio('rain.mp3'), // 雪も雨の音を使用
            storm: new Audio('storm.mp3')
        };
        Object.values(sounds).forEach(s => { s.loop = true; });

        function resize() { 
            w = cvs.width = window.innerWidth; 
            h = cvs.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. 時間同期の修正（確実に2桁表示にする）
        function updateClock() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                            now.getMinutes().toString().padStart(2, '0') + ':' +
                            now.getSeconds().toString().padStart(2, '0');
            clockEl.innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 雨・雪の描画システムの修正
        class Particle {
            constructor(type) {
                this.type = type;
                this.init();
            }
            init() {
                this.x = Math.random() * w;
                this.y = Math.random() * h; // 最初は画面全体に散らす
                this.v = (this.type === 'snow') ? Math.random() * 2 + 1 : Math.random() * 20 + 15;
                this.size = (this.type === 'snow') ? Math.random() * 3 + 1 : 20;
            }
            update() {
                this.y += this.v;
                if (this.y > h) {
                    this.y = -20;
                    this.x = Math.random() * w;
                }
            }
            draw() {
                ctx.beginPath();
                if (this.type === 'snow') {
                    ctx.fillStyle = 'white';
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = 'rgba(174, 188, 224, 0.8)';
                    ctx.lineWidth = 1;
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + this.size);
                    ctx.stroke();
                }
            }
        }

        // 3. 天気切り替え（ここを大幅強化）
        document.getElementById('weather-btn').onclick = () => {
            const modes = ['clear', 'snow', 'rain', 'storm'];
            wType = modes[(modes.indexOf(wType) + 1) % modes.length];
            document.getElementById('weather-btn').innerText = "WEATHER: " + wType.toUpperCase();

            // 全ての音を止める
            Object.values(sounds).forEach(s => { s.pause(); s.currentTime = 0; });
            // 現在の音を再生
            sounds[wType].play().catch(() => console.log("Click needed for audio"));

            // パーティクルの再生成
            particles = [];
            let count = 0;
            if (wType === 'snow') count = 150;
            else if (wType === 'rain') count = 300;
            else if (wType === 'storm') count = 600;

            for (let i = 0; i < count; i++) {
                particles.push(new Particle(wType));
            }
        };

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (wType === 'storm' && Math.random() > 0.98) {
                flash.style.opacity = 0.4;
                setTimeout(() => { flash.style.opacity = 0; }, 50);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // マウス移動
        document.addEventListener('mousemove', (e) => {
            const x = (w / 2 - e.clientX) / 30;
            const y = (h / 2 - e.clientY) / 30;
            bg.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
